version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - 8000:8000
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BACKEND_PORT=8000
    volumes:
      - ./backend/runtime:/app/runtime
      - ./backend:/app
  frontend:
    build: ./frontend
    ports:
      - 5173:5173
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
